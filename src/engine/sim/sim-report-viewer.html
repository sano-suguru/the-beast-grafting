<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sim Balance Report</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: "Segoe UI", system-ui, sans-serif;
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      h1 {
        color: #c4a882;
        font-size: 1.6rem;
        margin-bottom: 4px;
      }
      h2 {
        color: #c4a882;
        font-size: 1.2rem;
        margin: 24px 0 12px;
        border-bottom: 1px solid #333;
        padding-bottom: 6px;
      }
      h3 {
        color: #a89070;
        font-size: 1rem;
        margin: 16px 0 8px;
      }
      .meta {
        color: #888;
        font-size: 0.85rem;
        margin-bottom: 16px;
      }
      nav {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      nav button {
        background: #16213e;
        border: 1px solid #444;
        color: #ccc;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 0.85rem;
      }
      nav button.active {
        background: #0f3460;
        color: #e0e0e0;
        border-color: #c4a882;
      }
      section {
        display: none;
      }
      section.active {
        display: block;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.82rem;
        margin-bottom: 16px;
      }
      th {
        background: #16213e;
        color: #c4a882;
        padding: 6px 8px;
        text-align: left;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        position: sticky;
        top: 0;
      }
      th:hover {
        background: #1a2a4e;
      }
      th .arrow {
        font-size: 0.7rem;
        margin-left: 3px;
        opacity: 0.5;
      }
      th.sorted .arrow {
        opacity: 1;
      }
      td {
        padding: 5px 8px;
        border-bottom: 1px solid #2a2a3e;
      }
      tr:hover {
        background: #1e1e3a;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .warn {
        color: #e74c3c;
        font-weight: 600;
      }
      .ok {
        color: #2ecc71;
      }
      .matrix {
        overflow-x: auto;
      }
      .matrix table {
        width: auto;
      }
      .matrix td,
      .matrix th {
        text-align: center;
        padding: 6px 10px;
        min-width: 80px;
      }
      .outlier-list {
        background: #2a1a1a;
        border: 1px solid #e74c3c44;
        border-radius: 6px;
        padding: 12px;
        margin: 8px 0;
      }
      .outlier-list li {
        margin: 4px 0;
        font-size: 0.85rem;
      }
      .overview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .stat-card {
        background: #16213e;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 14px;
      }
      .stat-card .label {
        color: #888;
        font-size: 0.8rem;
      }
      .stat-card .value {
        color: #c4a882;
        font-size: 1.4rem;
        font-weight: 600;
      }
      .scroll-wrap {
        max-height: 70vh;
        overflow-y: auto;
      }
      details {
        margin: 4px 0;
      }
      details summary {
        cursor: pointer;
        padding: 4px 0;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>The Beast Grafter &#x2014; Sim Balance Report</h1>
    <div class="meta" id="generated-at"></div>
    <nav id="tabs"></nav>

    <section id="s-overview" class="active"></section>
    <section id="s-synergies"></section>
    <section id="s-matchups"></section>
    <section id="s-balance"></section>
    <section id="s-crossnight"></section>
    <section id="s-scaling"></section>
    <section id="s-ga"></section>
    <section id="s-meta"></section>

    <script type="application/json" id="sim-data">
      { "_placeholder": true }
    </script>
    <script>
      (function () {
        "use strict";

        // ── Utilities ──

        function wr(rate) {
          return (rate * 100).toFixed(1);
        }
        function num(v, d) {
          return v.toFixed(d || 0);
        }
        function pct(v) {
          return (v * 100).toFixed(1);
        }

        function wrColor(rate) {
          if (rate >= 0.55) return rate >= 0.65 ? "#e74c3c" : "#e67e22";
          if (rate <= 0.45) return rate <= 0.35 ? "#3498db" : "#2ecc71";
          return "#2ecc71";
        }

        function esc(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function el(tag, attrs, children) {
          var e = document.createElement(tag);
          if (attrs)
            Object.keys(attrs).forEach(function (k) {
              if (k === "textContent") e.textContent = attrs[k];
              else if (k === "className") e.className = attrs[k];
              else if (k === "innerHTML") e.innerHTML = attrs[k];
              else e.setAttribute(k, attrs[k]);
            });
          if (children)
            children.forEach(function (c) {
              if (typeof c === "string") e.appendChild(document.createTextNode(c));
              else if (c) e.appendChild(c);
            });
          return e;
        }

        // ── Tab Navigation ──

        var TABS = [
          ["s-overview", "Overview"],
          ["s-synergies", "Pair Synergies"],
          ["s-matchups", "Matchups"],
          ["s-balance", "Unit Balance"],
          ["s-crossnight", "Cross-Night"],
          ["s-scaling", "Scaling"],
          ["s-ga", "GA Discovery"],
          ["s-meta", "Meta Health"],
        ];

        function initTabs() {
          var nav = document.getElementById("tabs");
          TABS.forEach(function (t, i) {
            var btn = el("button", { "data-target": t[0], textContent: t[1] });
            if (i === 0) btn.classList.add("active");
            btn.addEventListener("click", function () {
              nav.querySelectorAll("button").forEach(function (b) {
                b.classList.remove("active");
              });
              document.querySelectorAll("section").forEach(function (s) {
                s.classList.remove("active");
              });
              btn.classList.add("active");
              var target = document.getElementById(btn.getAttribute("data-target"));
              if (target) target.classList.add("active");
            });
            nav.appendChild(btn);
          });
        }

        // ── Sortable Table ──

        function makeSortable(table) {
          var ths = table.querySelectorAll("thead th");
          ths.forEach(function (th, idx) {
            var arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.textContent = "\u25B2";
            th.appendChild(arrow);
            th.addEventListener("click", function () {
              var tbody = table.querySelector("tbody");
              var rows = Array.from(tbody.querySelectorAll("tr"));
              var asc = th.classList.contains("sorted") && !th.classList.contains("desc");
              ths.forEach(function (t) {
                t.classList.remove("sorted", "desc");
              });
              th.classList.add("sorted");
              if (!asc) th.classList.add("desc");
              rows.sort(function (a, b) {
                var av = a.children[idx].textContent.replace(/%/g, "").replace(/\+/g, "");
                var bv = b.children[idx].textContent.replace(/%/g, "").replace(/\+/g, "");
                var an = parseFloat(av),
                  bn = parseFloat(bv);
                if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
                return asc ? av.localeCompare(bv) : bv.localeCompare(av);
              });
              rows.forEach(function (r) {
                tbody.appendChild(r);
              });
            });
          });
        }

        // ── Unit Performance Table ──

        var PERF_COLS = [
          [
            "Unit",
            false,
            function (id) {
              return id;
            },
          ],
          [
            "T",
            true,
            function (_, p) {
              return p.tier;
            },
          ],
          [
            "Win%",
            true,
            function (_, p) {
              return wr(p.wins / p.appearances);
            },
          ],
          [
            "CI95",
            true,
            function (_, p) {
              return wr(p.winRateCI95[0]) + "-" + wr(p.winRateCI95[1]);
            },
          ],
          [
            "TNorm",
            true,
            function (_, p) {
              return (p.tierNormalizedWinRate >= 0 ? "+" : "") + pct(p.tierNormalizedWinRate);
            },
          ],
          [
            "Dmg",
            true,
            function (_, p) {
              return num(p.avgDamage);
            },
          ],
          [
            "Recv",
            true,
            function (_, p) {
              return num(p.avgDamageReceived);
            },
          ],
          [
            "Kill",
            true,
            function (_, p) {
              return num(p.avgKills, 1);
            },
          ],
          [
            "Spawn",
            true,
            function (_, p) {
              return num(p.avgSpawnsProduced, 1);
            },
          ],
          [
            "Buff+",
            true,
            function (_, p) {
              return num(p.avgBuffAtk, 1) + "/" + num(p.avgBuffHp, 1);
            },
          ],
          [
            "Gave+",
            true,
            function (_, p) {
              return num(p.avgBuffAtkGiven, 1) + "/" + num(p.avgBuffHpGiven, 1);
            },
          ],
          [
            "Surv%",
            true,
            function (_, p) {
              return pct(p.survivalRate);
            },
          ],
          [
            "DeathF",
            true,
            function (_, p) {
              return p.avgDeathFrame !== null ? num(p.avgDeathFrame, 1) : "-";
            },
          ],
          [
            "Skill/b",
            true,
            function (_, p) {
              return num(p.totalSkillActivations / p.appearances, 1);
            },
          ],
          [
            "Impact",
            true,
            function (_, p) {
              return num(p.impactScore, 1);
            },
          ],
          [
            "n",
            true,
            function (_, p) {
              return p.appearances;
            },
          ],
        ];

        function renderPerfTable(container, perfs) {
          var entries = Object.entries(perfs);
          if (entries.length === 0) {
            container.innerHTML = "<p>No unit data</p>";
            return;
          }

          entries.sort(function (a, b) {
            return b[1].wins / b[1].appearances - a[1].wins / a[1].appearances;
          });

          var table = el("table", { className: "sortable" });
          var thead = el("thead");
          var headRow = el("tr");
          PERF_COLS.forEach(function (col) {
            headRow.appendChild(el("th", { className: col[1] ? "num" : "" }, [col[0]]));
          });
          thead.appendChild(headRow);
          table.appendChild(thead);

          var tbody = el("tbody");
          entries.forEach(function (entry) {
            var id = entry[0],
              p = entry[1];
            var winRate = p.wins / p.appearances;
            var row = el("tr");
            PERF_COLS.forEach(function (col, ci) {
              var val = col[2](id, p);
              var td = el("td", { className: col[1] ? "num" : "", textContent: String(val) });
              if (ci === 2) td.style.color = wrColor(winRate);
              row.appendChild(td);
            });
            tbody.appendChild(row);
          });
          table.appendChild(tbody);
          container.appendChild(table);
          makeSortable(table);
        }

        // ── Overview ──

        function renderOverview(data) {
          var sec = document.getElementById("s-overview");
          sec.innerHTML = "<h2>Overview</h2>";
          var grid = el("div", { className: "overview-grid" });

          function addCard(label, value) {
            grid.appendChild(
              el("div", {
                className: "stat-card",
                innerHTML:
                  '<div class="label">' +
                  esc(label) +
                  '</div><div class="value">' +
                  esc(String(value)) +
                  "</div>",
              }),
            );
          }

          if (data.positionOptimization) {
            addCard("Position Opt Delta", "+" + num(data.positionOptimization.deltaPp, 1) + "pp");
          }
          if (data.randomBalance.length > 0) {
            var main =
              data.randomBalance.find(function (r) {
                return r.trials >= 1000;
              }) || data.randomBalance[0];
            addCard("Mirror Win Rate", wr(main.winRate) + "%");
            addCard("Avg Frame Count", num(main.avgFrameCount, 0));
          }
          var totalMatchups = data.archetypeMatchups.length;
          var imbalanced = data.archetypeMatchups.filter(function (m) {
            return m.warnings.some(function (w) {
              return w.indexOf("IMBALANCE") >= 0;
            });
          }).length;
          addCard("Archetype Matchups", totalMatchups + " (" + imbalanced + " imbalanced)");
          if (data.pairSynergies && data.pairSynergies.length > 0) {
            var topDelta = data.pairSynergies[0].synergyDelta;
            addCard(
              "Pair Synergies",
              data.pairSynergies.length + " (top δ=" + num(topDelta * 100, 1) + "pp)",
            );
          }
          if (data.discoveredCompositions && data.discoveredCompositions.length > 0) {
            addCard("Discovered Compositions", data.discoveredCompositions.length);
          }
          if (data.crossNight.length > 0) {
            var totalOutliers = data.crossNight.reduce(function (s, c) {
              return s + c.outliers.length;
            }, 0);
            addCard("Cross-Night Outliers", totalOutliers);
          }
          sec.appendChild(grid);
        }

        // ── Matchups ──

        function renderMatchups(data) {
          var sec = document.getElementById("s-matchups");
          sec.innerHTML = "<h2>Discovered Archetype Matchups</h2>";
          if (data.archetypeMatchups.length === 0) {
            sec.innerHTML += "<p>No data</p>";
            return;
          }

          var names = [];
          var lookup = {};
          data.archetypeMatchups.forEach(function (m) {
            if (names.indexOf(m.teamA) < 0) names.push(m.teamA);
            if (names.indexOf(m.teamB) < 0) names.push(m.teamB);
            lookup[m.teamA + ":" + m.teamB] = m;
          });

          // Matrix
          var wrap = el("div", { className: "matrix" });
          var table = el("table");
          var headRow = el("tr");
          headRow.appendChild(el("th"));
          names.forEach(function (n) {
            headRow.appendChild(el("th", { textContent: n }));
          });
          table.appendChild(headRow);

          names.forEach(function (row) {
            var tr = el("tr");
            tr.appendChild(el("th", { textContent: row }));
            names.forEach(function (col) {
              if (row === col) {
                tr.appendChild(el("td", { style: "background:#2a2a3e", textContent: "-" }));
                return;
              }
              var m = lookup[row + ":" + col] || lookup[col + ":" + row];
              if (!m) {
                tr.appendChild(el("td", { textContent: "?" }));
                return;
              }
              var rate = m.teamA === row ? m.aWins / m.trials : m.bWins / m.trials;
              var c = wrColor(rate);
              tr.appendChild(
                el("td", {
                  style: "background:" + c + "22;color:" + c,
                  textContent: wr(rate) + "%",
                }),
              );
            });
            table.appendChild(tr);
          });
          wrap.appendChild(table);
          sec.appendChild(wrap);

          // Details
          sec.appendChild(el("h3", { textContent: "Matchup Details" }));
          data.archetypeMatchups.forEach(function (m) {
            var aRate = m.aWins / m.trials;
            var cls = m.warnings.length > 0 ? "warn" : "ok";
            var warn = m.warnings.length > 0 ? " [" + m.warnings.join(", ") + "]" : "";
            var summary =
              esc(m.teamA) +
              " vs " +
              esc(m.teamB) +
              ": " +
              wr(aRate) +
              "% (" +
              m.aWins +
              "W/" +
              m.bWins +
              "L/" +
              m.draws +
              "D) avg " +
              num(m.avgFrameCount) +
              "f" +
              warn;

            var details = document.createElement("details");
            var sumEl = el("summary", { className: cls, innerHTML: summary });
            details.appendChild(sumEl);
            var perfDiv = el("div");
            renderPerfTable(perfDiv, m.unitPerformance);
            details.appendChild(perfDiv);
            sec.appendChild(details);
          });
        }

        // ── Unit Balance ──

        function renderBalance(data) {
          var sec = document.getElementById("s-balance");
          var main = data.randomBalance.find(function (r) {
            return r.trials >= 1000;
          });
          if (!main) {
            sec.innerHTML = "<h2>Unit Balance</h2><p>No data</p>";
            return;
          }
          sec.innerHTML =
            "<h2>Unit Balance (Night " + main.night + ", " + main.trials + " trials)</h2>";
          var wrap = el("div", { className: "scroll-wrap" });
          renderPerfTable(wrap, main.unitPerformance);
          sec.appendChild(wrap);
        }

        // ── Cross-Night ──

        function renderCrossNight(data) {
          var sec = document.getElementById("s-crossnight");
          sec.innerHTML = "<h2>Cross-Night Balance</h2>";
          if (data.crossNight.length === 0) {
            sec.innerHTML += "<p>No data</p>";
            return;
          }

          var table = el("table");
          table.innerHTML =
            "<tr><th>Night</th><th>Win Rate</th><th>Avg Frames</th><th>Unique Units</th><th>Outliers</th></tr>";
          data.crossNight.forEach(function (c) {
            var tr = el("tr");
            tr.innerHTML =
              '<td class="num">' +
              c.night +
              "</td>" +
              '<td class="num" style="color:' +
              wrColor(c.winRate) +
              '">' +
              wr(c.winRate) +
              "%</td>" +
              '<td class="num">' +
              num(c.avgFrameCount) +
              "</td>" +
              '<td class="num">' +
              c.uniqueUnitCount +
              "</td>" +
              '<td class="num">' +
              c.outliers.length +
              "</td>";
            table.appendChild(tr);
          });
          sec.appendChild(table);

          var allOutliers = [];
          data.crossNight.forEach(function (c) {
            allOutliers = allOutliers.concat(c.outliers);
          });
          if (allOutliers.length > 0) {
            var box = el("div", { className: "outlier-list" });
            box.innerHTML =
              "<strong>Outliers</strong><ul>" +
              allOutliers
                .map(function (o) {
                  return (
                    "<li>T" +
                    o.tier +
                    " N" +
                    o.night +
                    ": <strong>" +
                    esc(o.unitId) +
                    "</strong> win=" +
                    wr(o.winRate) +
                    "% (n=" +
                    o.appearances +
                    ")</li>"
                  );
                })
                .join("") +
              "</ul>";
            sec.appendChild(box);
          }
        }

        // ── Pair Synergies & Discovered Compositions ──

        function renderSynergies(data) {
          var sec = document.getElementById("s-synergies");
          sec.innerHTML = "<h2>Pair Synergies &amp; Discovered Compositions</h2>";

          // Pair Synergies Table
          if (!data.pairSynergies || data.pairSynergies.length === 0) {
            sec.appendChild(el("p", { textContent: "No pair synergy data" }));
          } else {
            sec.appendChild(el("h3", { textContent: "Top Pair Synergies (by CI lower bound)" }));
            var wrap = el("div", { className: "scroll-wrap" });
            var table = el("table", { className: "sortable" });
            var thead = el("thead");
            var headRow = el("tr");
            ["Unit A", "Unit B", "Co-Win%", "Expected%", "δ (pp)", "CI95 (pp)", "Samples"].forEach(
              function (h) {
                headRow.appendChild(el("th", { className: "num", textContent: h }));
              },
            );
            thead.appendChild(headRow);
            table.appendChild(thead);

            var tbody = el("tbody");
            data.pairSynergies.forEach(function (s) {
              var tr = el("tr");
              var delta = s.synergyDelta * 100;
              var deltaColor = delta > 0 ? "#e74c3c" : delta < 0 ? "#3498db" : "#888";
              tr.innerHTML =
                "<td>" +
                esc(s.unitA) +
                "</td>" +
                "<td>" +
                esc(s.unitB) +
                "</td>" +
                '<td class="num">' +
                wr(s.coWinRate) +
                "%</td>" +
                '<td class="num">' +
                wr(s.expectedWinRate) +
                "%</td>" +
                '<td class="num" style="color:' +
                deltaColor +
                '">' +
                (delta >= 0 ? "+" : "") +
                num(delta, 1) +
                "</td>" +
                '<td class="num">' +
                (s.ciLower != null
                  ? "[" + num(s.ciLower * 100, 1) + ", " + num(s.ciUpper * 100, 1) + "]"
                  : "—") +
                "</td>" +
                '<td class="num">' +
                s.sampleCount +
                "</td>";
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            wrap.appendChild(table);
            sec.appendChild(wrap);
            makeSortable(table);
          }

          // Discovered Compositions
          if (!data.discoveredCompositions || data.discoveredCompositions.length === 0) {
            sec.appendChild(el("p", { textContent: "No discovered compositions" }));
          } else {
            sec.appendChild(el("h3", { textContent: "Discovered Compositions" }));
            var cTable = el("table");
            var cThead = el("thead");
            var cHeadRow = el("tr");
            ["#", "Name", "Members", "Total δ (pp)"].forEach(function (h) {
              cHeadRow.appendChild(el("th", { className: "num", textContent: h }));
            });
            cThead.appendChild(cHeadRow);
            cTable.appendChild(cThead);

            var cTbody = el("tbody");
            data.discoveredCompositions.forEach(function (c, i) {
              var tr = el("tr");
              tr.innerHTML =
                '<td class="num">' +
                (i + 1) +
                "</td>" +
                "<td>" +
                esc(c.name) +
                "</td>" +
                "<td>" +
                c.unitIds.map(esc).join(", ") +
                "</td>" +
                '<td class="num">' +
                num(c.totalSynergyDelta * 100, 1) +
                "</td>";
              cTbody.appendChild(tr);
            });
            cTable.appendChild(cTbody);
            sec.appendChild(cTable);
          }
        }

        // ── Scaling ──

        function renderRankingTable(container, title, units, metricFn) {
          if (units.length === 0) return;
          container.appendChild(el("h3", { textContent: title }));
          var table = el("table");
          table.innerHTML =
            "<tr><th>#</th><th>Unit</th><th>Tier</th><th>Value</th><th>Win%</th><th>Impact</th><th>n</th></tr>";
          units.forEach(function (u, i) {
            var p = u.perf;
            var winRate = p.wins / p.appearances;
            var tr = el("tr");
            tr.innerHTML =
              '<td class="num">' +
              (i + 1) +
              "</td>" +
              "<td>" +
              esc(u.unitId) +
              "</td>" +
              '<td class="num">' +
              p.tier +
              "</td>" +
              '<td class="num">' +
              metricFn(p) +
              "</td>" +
              '<td class="num" style="color:' +
              wrColor(winRate) +
              '">' +
              wr(winRate) +
              "%</td>" +
              '<td class="num">' +
              num(p.impactScore, 1) +
              "</td>" +
              '<td class="num">' +
              p.appearances +
              "</td>";
            table.appendChild(tr);
          });
          container.appendChild(table);
        }

        function renderScaling(data) {
          var sec = document.getElementById("s-scaling");
          sec.innerHTML = "<h2>Scaling &amp; Durability Analysis</h2>";
          if (!data.scalingAnalysis) {
            sec.innerHTML += "<p>No data</p>";
            return;
          }
          var s = data.scalingAnalysis;
          renderRankingTable(sec, "Top Buff Receivers", s.topBuffReceivers, function (p) {
            return num(p.avgBuffAtk + p.avgBuffHp, 1);
          });
          renderRankingTable(sec, "Earliest Deaths", s.earliestDeaths, function (p) {
            return p.avgDeathFrame !== null ? num(p.avgDeathFrame, 1) : "-";
          });
          renderRankingTable(sec, "Top Damage Sponges", s.topDamageSponges, function (p) {
            return num(p.avgDamageReceived);
          });
          renderRankingTable(sec, "Top Killers", s.topKillers, function (p) {
            return num(p.avgKills, 1);
          });
          renderRankingTable(sec, "Top Spawners", s.topSpawners, function (p) {
            return num(p.avgSpawnsProduced, 1);
          });
        }

        // ── GA Discovery ──

        function renderGA(data) {
          var sec = document.getElementById("s-ga");
          var ga = data.gaDiscovery;
          if (!ga) {
            sec.innerHTML = "<h2>GA Discovery</h2><p>No GA data available.</p>";
            return;
          }
          sec.innerHTML = "<h2>GA Discovery</h2>";

          // Alerts
          if (ga.breakageAlerts.length > 0) {
            var alertBox = el("div", {
              style:
                "background:#4a1a1a;border:1px solid #ff4444;padding:12px;border-radius:6px;margin-bottom:16px",
            });
            alertBox.appendChild(
              el("strong", { style: "color:#ff4444", textContent: "⚠ Breakage Alerts" }),
            );
            var alertList = el("ul", { style: "margin-top:8px;padding-left:20px" });
            ga.breakageAlerts.forEach(function (msg) {
              alertList.appendChild(el("li", { style: "color:#ffaaaa", textContent: msg }));
            });
            alertBox.appendChild(alertList);
            sec.appendChild(alertBox);
          }

          // Summary cards
          var grid = el("div", { className: "overview-grid" });
          function addCard(label, value) {
            grid.appendChild(
              el("div", {
                className: "stat-card",
                innerHTML:
                  '<div class="label">' +
                  esc(label) +
                  '</div><div class="value">' +
                  esc(String(value)) +
                  "</div>",
              }),
            );
          }
          addCard("Total Battles", ga.totalBattles.toLocaleString());
          addCard("Top Fitness", wr(ga.topTeams[0] ? ga.topTeams[0].fitness : 0) + "%");
          addCard(
            "Convergence",
            ga.convergenceGeneration !== null
              ? "Gen " + ga.convergenceGeneration
              : "Gen " + ga.generationStats.length,
          );
          addCard(
            "Novel Teams",
            ga.topTeams.filter(function (t) {
              return t.novelty;
            }).length +
              "/" +
              ga.topTeams.length,
          );
          sec.appendChild(grid);

          // Top teams table
          sec.appendChild(el("h2", { textContent: "Top Compositions" }));
          var table = el("table", { className: "sortable" });
          var thead = el("thead");
          var headRow = el("tr");
          ["Rank", "Units", "Win%", "CI95", "Novel"].forEach(function (h) {
            headRow.appendChild(
              el("th", { className: h !== "Units" ? "num" : "", textContent: h }),
            );
          });
          thead.appendChild(headRow);
          table.appendChild(thead);

          var tbody = el("tbody");
          ga.topTeams.forEach(function (team, i) {
            var row = el("tr");
            row.appendChild(el("td", { className: "num", textContent: String(i + 1) }));
            row.appendChild(el("td", { textContent: team.teamIds.join(", ") }));
            var wrTd = el("td", {
              className: "num",
              textContent: wr(team.fitness) + "%",
              style: "color:" + wrColor(team.fitness),
            });
            row.appendChild(wrTd);
            row.appendChild(
              el("td", {
                className: "num",
                textContent: wr(team.fitnessCI95[0]) + "-" + wr(team.fitnessCI95[1]),
              }),
            );
            row.appendChild(
              el("td", {
                className: "num",
                textContent: team.novelty ? "✦ NEW" : "—",
                style: team.novelty ? "color:#ffcc00;font-weight:bold" : "",
              }),
            );
            tbody.appendChild(row);
          });
          table.appendChild(tbody);
          sec.appendChild(table);
          makeSortable(table);

          // Convergence curve (canvas)
          if (ga.generationStats.length > 1) {
            sec.appendChild(el("h2", { textContent: "Convergence Curve" }));
            var canvas = el("canvas", { width: 700, height: 280 });
            canvas.style.background = "#16213e";
            canvas.style.borderRadius = "6px";
            canvas.style.display = "block";
            canvas.style.marginBottom = "16px";
            sec.appendChild(canvas);

            var ctx = canvas.getContext("2d");
            var W = canvas.width,
              H = canvas.height;
            var pad = { t: 20, r: 20, b: 30, l: 50 };
            var gw = W - pad.l - pad.r,
              gh = H - pad.t - pad.b;
            var stats = ga.generationStats;
            var maxGen = stats[stats.length - 1].generation;
            var minF = Math.min.apply(
              null,
              stats.map(function (s) {
                return s.avgFitness;
              }),
            );
            var maxF = Math.max.apply(
              null,
              stats.map(function (s) {
                return s.bestFitness;
              }),
            );
            var fRange = maxF - minF || 0.01;

            function gx(gen) {
              return pad.l + (gen / (maxGen || 1)) * gw;
            }
            function gy(f) {
              return pad.t + gh - ((f - minF) / fRange) * gh;
            }

            // Grid
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 0.5;
            for (var g = 0; g <= 4; g++) {
              var yy = pad.t + (gh * g) / 4;
              ctx.beginPath();
              ctx.moveTo(pad.l, yy);
              ctx.lineTo(W - pad.r, yy);
              ctx.stroke();
            }

            // Best fitness line
            ctx.strokeStyle = "#c4a882";
            ctx.lineWidth = 2;
            ctx.beginPath();
            stats.forEach(function (s, i) {
              var x = gx(s.generation),
                y = gy(s.bestFitness);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Avg fitness line
            ctx.strokeStyle = "#6a9bc3";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            stats.forEach(function (s, i) {
              var x = gx(s.generation),
                y = gy(s.avgFitness);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Labels
            ctx.fillStyle = "#999";
            ctx.font = "11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Generation", W / 2, H - 4);
            ctx.textAlign = "left";
            ctx.fillText(wr(maxF) + "%", pad.l + 4, pad.t - 4);
            ctx.fillText(wr(minF) + "%", pad.l + 4, H - pad.b + 14);

            // Legend
            ctx.fillStyle = "#c4a882";
            ctx.fillText("■ Best", W - pad.r - 120, pad.t + 14);
            ctx.fillStyle = "#6a9bc3";
            ctx.fillText("■ Avg", W - pad.r - 60, pad.t + 14);
          }

          // Night-varying GA results
          var nightGa = data.nightGaResults;
          if (nightGa && nightGa.length > 0) {
            sec.appendChild(el("h2", { textContent: "Cross-Night GA" }));
            nightGa.forEach(function (entry) {
              var hdr = el("h3", {
                textContent: "Night " + entry.night + " (pool: " + entry.poolSize + " units)",
                style: "color:#c4a882;margin:16px 0 8px",
              });
              sec.appendChild(hdr);

              if (entry.breakageAlerts.length > 0) {
                var ab = el("div", {
                  style:
                    "background:#4a1a1a;border:1px solid #ff4444;padding:8px;border-radius:4px;margin-bottom:8px;font-size:0.9em",
                });
                entry.breakageAlerts.forEach(function (msg) {
                  ab.appendChild(el("div", { style: "color:#ffaaaa", textContent: msg }));
                });
                sec.appendChild(ab);
              }

              if (entry.topTeams.length > 0) {
                var ntable = el("table");
                var nth = el("thead");
                var nhr = el("tr");
                ["#", "Units", "Win%", "CI95"].forEach(function (h) {
                  nhr.appendChild(
                    el("th", { className: h !== "Units" ? "num" : "", textContent: h }),
                  );
                });
                nth.appendChild(nhr);
                ntable.appendChild(nth);
                var ntb = el("tbody");
                entry.topTeams.slice(0, 5).forEach(function (t, i) {
                  var r = el("tr");
                  r.appendChild(el("td", { className: "num", textContent: String(i + 1) }));
                  r.appendChild(el("td", { textContent: t.teamIds.join(", ") }));
                  r.appendChild(
                    el("td", {
                      className: "num",
                      textContent: wr(t.fitness) + "%",
                      style: "color:" + wrColor(t.fitness),
                    }),
                  );
                  r.appendChild(
                    el("td", {
                      className: "num",
                      textContent: wr(t.fitnessCI95[0]) + "-" + wr(t.fitnessCI95[1]),
                    }),
                  );
                  ntb.appendChild(r);
                });
                ntable.appendChild(ntb);
                sec.appendChild(ntable);
              }
            });
          }
        }

        // ── Meta Health ──

        function verdictBadge(verdict) {
          var colors = {
            healthy: "#2ecc71",
            slightly_skewed: "#e67e22",
            dominant_meta: "#e74c3c",
            degenerate: "#ff0000",
          };
          var labels = {
            healthy: "✓ Healthy",
            slightly_skewed: "⚠ Slightly Skewed",
            dominant_meta: "✗ Dominant Meta",
            degenerate: "✗✗ Degenerate",
          };
          return el("span", {
            textContent: labels[verdict] || verdict,
            style:
              "color:" +
              (colors[verdict] || "#888") +
              ";font-weight:bold;font-size:1.2em;padding:4px 12px;border:2px solid " +
              (colors[verdict] || "#888") +
              ";border-radius:6px",
          });
        }

        function payoffColor(rate) {
          if (rate >= 0.6) return "rgba(231,76,60," + Math.min((rate - 0.5) * 2, 1) * 0.6 + ")";
          if (rate <= 0.4) return "rgba(52,152,219," + Math.min((0.5 - rate) * 2, 1) * 0.6 + ")";
          return "transparent";
        }

        function renderMeta(data) {
          var sec = document.getElementById("s-meta");
          var meta = data.metaAnalysis;
          if (!meta) {
            sec.innerHTML = "<h2>Meta Health</h2><p>No meta analysis data available.</p>";
            return;
          }
          sec.innerHTML = "<h2>Meta Health Analysis</h2>";

          // Verdict badge
          var verdictDiv = el("div", { style: "margin-bottom:16px" });
          verdictDiv.appendChild(verdictBadge(meta.healthVerdict));
          sec.appendChild(verdictDiv);

          // Reasons
          if (meta.verdictReasons.length > 0) {
            var reasons = el("ul", { style: "margin-bottom:16px;padding-left:20px" });
            meta.verdictReasons.forEach(function (r) {
              reasons.appendChild(el("li", { textContent: r }));
            });
            sec.appendChild(reasons);
          }

          // Summary cards
          var grid = el("div", { className: "overview-grid" });
          function addCard(label, value) {
            grid.appendChild(
              el("div", {
                className: "stat-card",
                innerHTML:
                  '<div class="label">' +
                  esc(label) +
                  '</div><div class="value">' +
                  esc(String(value)) +
                  "</div>",
              }),
            );
          }
          addCard("Cyclicity", pct(meta.cyclicityScore) + "%");
          addCard("Entropy", num(meta.equilibriumEntropy, 2) + " / " + num(meta.maxEntropy, 2));
          addCard("Nash Converged", meta.nashConverged ? "Yes" : "No");
          addCard("Dominant Teams", meta.dominantTeams.length);
          sec.appendChild(grid);

          // Payoff matrix heatmap
          sec.appendChild(el("h2", { textContent: "Payoff Matrix (Win Rate)" }));
          var table = el("table", { className: "sortable" });
          var thead = el("thead");
          var headRow = el("tr");
          headRow.appendChild(el("th", { textContent: "" }));
          meta.teamLabels.forEach(function (l) {
            headRow.appendChild(el("th", { textContent: l, style: "font-size:0.8em" }));
          });
          thead.appendChild(headRow);
          table.appendChild(thead);

          var tbody = el("tbody");
          meta.payoffMatrix.forEach(function (row, i) {
            var tr = el("tr");
            tr.appendChild(
              el("td", { textContent: meta.teamLabels[i], style: "font-weight:bold" }),
            );
            row.forEach(function (cell, j) {
              var td = el("td", {
                className: "num",
                textContent: i === j ? "—" : wr(cell.winRate) + "%",
                style: i === j ? "color:#666" : "background:" + payoffColor(cell.winRate),
              });
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          sec.appendChild(table);

          // Nash equilibrium
          sec.appendChild(el("h2", { textContent: "Nash Equilibrium (Mixed Strategy)" }));
          var nashDiv = el("div", { style: "margin-bottom:16px" });
          var sorted = meta.nashEquilibrium.slice().sort(function (a, b) {
            return b.probability - a.probability;
          });
          sorted.forEach(function (entry) {
            var barWidth = Math.max(entry.probability * 400, 2);
            var bar = el("div", {
              style: "display:flex;align-items:center;margin:4px 0",
            });
            bar.appendChild(
              el("span", {
                textContent: entry.team,
                style: "width:80px;font-size:0.85em",
              }),
            );
            bar.appendChild(
              el("div", {
                style:
                  "width:" +
                  barWidth +
                  "px;height:20px;background:#3498db;border-radius:3px;margin-right:8px",
              }),
            );
            bar.appendChild(
              el("span", {
                textContent: pct(entry.probability) + "%",
                style: "font-size:0.85em;color:#aaa",
              }),
            );
            nashDiv.appendChild(bar);
          });
          sec.appendChild(nashDiv);

          // Dominance alerts
          if (meta.dominantTeams.length > 0) {
            var alertBox = el("div", {
              style:
                "background:#4a1a1a;border:1px solid #ff4444;padding:12px;border-radius:6px;margin-top:16px",
            });
            alertBox.appendChild(
              el("strong", { style: "color:#ff4444", textContent: "⚠ Dominant Strategies" }),
            );
            var alertList = el("ul", { style: "margin-top:8px;padding-left:20px" });
            meta.dominantTeams.forEach(function (d) {
              alertList.appendChild(
                el("li", {
                  style: "color:#ffaaaa",
                  textContent:
                    d.team + " (" + d.type + " dominant, min WR: " + wr(d.minWinRate) + "%)",
                }),
              );
            });
            alertBox.appendChild(alertList);
            sec.appendChild(alertBox);
          }
        }

        // ── Init ──

        var DATA = JSON.parse(document.getElementById("sim-data").textContent);

        if (DATA._placeholder) {
          document.getElementById("generated-at").textContent =
            "This is the template file. Open sim-results/latest.html instead.";
          return;
        }

        document.getElementById("generated-at").textContent = "Generated: " + DATA.generatedAt;
        initTabs();
        renderOverview(DATA);
        renderSynergies(DATA);
        renderMatchups(DATA);
        renderBalance(DATA);
        renderCrossNight(DATA);
        renderScaling(DATA);
        renderGA(DATA);
        renderMeta(DATA);
      })();
    </script>
  </body>
</html>
